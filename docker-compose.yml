

services:
  neo4j:
    image: neo4j:5.26-community
    container_name: kds_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?NEO4J_PASSWORD .env dosyasinda tanimli olmali}"
      NEO4J_dbms_usage__report_1enabled: "false"
    
      NEO4J_server_memory_heap_max__size: "2G"
      NEO4J_server_memory_pagecache_size: "2G"
    ports:
      - "7474:7474"
      - "7687:7687" 
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    networks: [kds_network]

  ollama:
    image: ollama/ollama:latest
    container_name: kds_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s
    networks: [kds_network]

  ollama-model-init:
    image: ollama/ollama:latest
    container_name: kds_ollama_model_init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama pull ${OLLAMA_MODEL:-llama3} && echo 'Model hazir: ${OLLAMA_MODEL:-llama3}'"
    networks: [kds_network]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kds_app
    restart: unless-stopped
    env_file: .env
    environment:
      NEO4J_URI: "bolt://neo4j:7687"
      OLLAMA_BASE_URL: "http://ollama:11434"
    depends_on:
      neo4j:
        condition: service_healthy
      ollama-model-init:
        condition: service_completed_successfully
    ports:
      - "8501:8501"
    networks: [kds_network]

networks:
  kds_network:
    driver: bridge

volumes:
  neo4j_data:
  neo4j_logs:
  ollama_models:
