# =============================================================================
# Kriz ve Afet Yönetimi Karar Destek Sistemi — üretim/kapalı-devre orkestrasyonu
# -----------------------------------------------------------------------------
# TSK / AFAD / UMKE kapalı ağındaki bir sunucuda TEK komutla ayağa kalkar:
#
#     cp .env.example .env      # bir kez: gerçek Neo4j parolasını girin
#     docker compose up -d --build
#
# Servisler:
#   neo4j              -> Bilgi Grafı veritabanı (bolt://neo4j:7687, HTTP UI :7474)
#   ollama              -> Yerel LLM çıkarım motoru (SAKOM GraphRAG raporları için)
#   ollama-model-init   -> Bir KEZ çalışıp gerekli modeli çeker, sonra çıkar (sidecar)
#   app                 -> Streamlit arayüzü + ETL/NLP Python backend (:8501)
#
# `.env` dosyası Docker Compose tarafından OTOMATİK okunur (aynı dizinde
# olduğu için ek `--env-file` bayrağı gerekmez); NEO4J_PASSWORD, OLLAMA_MODEL
# gibi değerler buradan gelir (bkz. .env.example).
# =============================================================================

services:
  neo4j:
    image: neo4j:5.26-community
    container_name: kds_neo4j
    restart: unless-stopped
    environment:
      # Neo4j'nin kendi NEO4J_AUTH formatı: kullanici/sifre.
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?NEO4J_PASSWORD .env dosyasinda tanimli olmali}"
      # Kapalı ağda internet'e "kullanım istatistiği" göndermeyi kapat.
      NEO4J_dbms_usage__report_1enabled: "false"
      # POINT INDEX (mekansal sorgular) icin yeterli bellek — 81 il / milyonlarca
      # dugum olcegi icin uretimde bu degerler sunucu RAM'ine gore ARTIRILMALI.
      NEO4J_server_memory_heap_max__size: "2G"
      NEO4J_server_memory_pagecache_size: "2G"
    ports:
      - "7474:7474" # Neo4j Browser (yönetim/hata ayıklama)
      - "7687:7687" # Bolt protokolü (uygulamanın kullandığı)
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    networks: [kds_network]

  ollama:
    image: ollama/ollama:latest
    container_name: kds_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    # NOT: GPU (RTX 4070 Ti vb.) hızlandırma için sunucuda NVIDIA Container
    # Toolkit kuruluysa aşağıdaki bloğun yorumunu kaldırın:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s
    networks: [kds_network]

  # Bir KEZ çalışıp .env'de belirtilen modeli (varsayılan llama3) `ollama`
  # servisine çeker, sonra 0 ile çıkar — modelin konteyner her yeniden
  # başladığında YENİDEN indirilmesini önler (volume'da kalıcı).
  ollama-model-init:
    image: ollama/ollama:latest
    container_name: kds_ollama_model_init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama pull ${OLLAMA_MODEL:-llama3} && echo 'Model hazir: ${OLLAMA_MODEL:-llama3}'"
    networks: [kds_network]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kds_app
    restart: unless-stopped
    env_file: .env
    environment:
      # Konteyner-ici DNS: servis adlari .env.example'daki gibi kullanilir.
      NEO4J_URI: "bolt://neo4j:7687"
      OLLAMA_BASE_URL: "http://ollama:11434"
    depends_on:
      neo4j:
        condition: service_healthy
      ollama-model-init:
        condition: service_completed_successfully
    ports:
      - "8501:8501"
    networks: [kds_network]

networks:
  kds_network:
    driver: bridge

volumes:
  neo4j_data:
  neo4j_logs:
  ollama_models:
